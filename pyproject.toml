[project]
name = "policy-agent"
version = "0.1.0"
description = "Indian Health Insurance Policy Decoder"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pdfplumber>=0.11",
    "google-genai>=1.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    # FastAPI's own runtime requirement for any multipart/form-data route
    # (web/app.py's /api/upload) — not vendored, must be installed
    # explicitly per FastAPI's own error message.
    "python-multipart>=0.0.9",
    # Dense retrieval (decoder/retrieve/dense.py) is no longer optional —
    # docs/HANDOVER.md §10 requires hybrid retrieval for every answer, and
    # decoder.orchestrator.PolicyDecoder now retrieves through
    # decoder.retrieve.hybrid.HybridRetriever unconditionally. Was deferred
    # as an extra while the SPIKE-2 corpus was empty (see git history);
    # promoted to a real dependency once there was a real corpus to embed.
    "sentence-transformers>=3.0",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest-playwright>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# docs/HANDOVER.md must stay a verbatim copy of the source spec (including
# its embedded pseudocode blocks) — never auto-formatted.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's own documented dependency-injection idiom — `File(...)` (and
# `Depends(...)`, `Query(...)`, etc.) as a parameter default is how it
# recognizes what to inject, not the general "mutable default" footgun
# B008 exists to catch.
extend-immutable-calls = ["fastapi.File", "fastapi.Depends", "fastapi.Query"]

[tool.mypy]
# Mypy-only setting — does NOT change requires-python above (still >=3.11).
# numpy>=2.1's own .pyi stubs use PEP 695 `type X = ...` syntax
# unconditionally (confirmed 2026-09-15, and a known, widespread ecosystem
# issue: github.com/python/mypy/issues/18701, /issues/21178 — mypy ties
# stub-syntax validity to `python_version` even for third-party stubs it
# doesn't control). numpy became a required dependency once dense
# retrieval (decoder/retrieve/dense.py) went from stub to real, so this now
# has to actually resolve rather than staying latent. Real Python-version
# compatibility is still enforced by what the test suite actually runs on
# (3.11+), not by this setting.
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["decoder"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
